
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <nav class="bg-yellow-300 text white">
        <div class="flex justify-between px-2 py-4">
            <a href="" class="font-semibold">Fooditems</a>
            <div class="space-x-6 font-semibold">
                <a href="{% url 'myapp:contact' %}">Contact</a>

                <a href="">Address</a>

                <a href="{% url 'myapp:about' %}">About us</a>

                <a href="{% url 'profile' %}" class="bg-pink-200 " > welcome {{user.username}} </a>
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>

            {% else %}
                <a href="{% url 'login' %}">Login</a>

            {% endif %}
            </div>
        
        </div>
    </nav>
    {% if messages %}
        {% for message in messages %}
            <div class="bg-teal-300 text-blue-400">
                {{message}}
            </div>
        {% endfor %}
    {% endif %}

    {% block body %}

    {% endblock %}
</body>
</html>
